[package]
name = "tokenpulse-phase2-probes"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "=0.33.0"
windows = { version = "=0.58.0", features = [
    "Foundation_Numerics", "Win32_Foundation", "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock",
    "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus", "Win32_System_RemoteDesktop", "Win32_System_SystemServices",
    "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"
] }

[[bin]]
name = "probe_antigravity"
path = "src/bin/probe_antigravity.rs"

[[bin]]
name = "probe_webview2"
path = "src/bin/probe_webview2.rs"

[[bin]]
name = "probe_overlay"
path = "src/bin/probe_overlay.rs"
