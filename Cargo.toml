[workspace]
resolver = "2"
members = [
    "crates/core-domain",
    "crates/provider-codex",
    "crates/provider-antigravity",
    "crates/store-sqlite",
    "crates/scheduler",
    "crates/ui-win32",
    "crates/ui-detail-web",
    "crates/app",
]
exclude = [
    "tools/phase2-probes",
]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
