[package]
name = "tokenpulse-provider-antigravity"
version = "0.1.0"
edition = "2021"

[dependencies]
tokenpulse-core-domain = { path = "../core-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
