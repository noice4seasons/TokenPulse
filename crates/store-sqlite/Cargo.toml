[package]
name = "tokenpulse-store-sqlite"
version = "0.1.0"
edition = "2021"

[dependencies]
tokenpulse-core-domain = { path = "../core-domain" }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
