[package]
name = "tokenpulse-scheduler"
version = "0.1.0"
edition = "2021"

[dependencies]
tokenpulse-core-domain = { path = "../core-domain" }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
