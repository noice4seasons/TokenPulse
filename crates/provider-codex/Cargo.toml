[package]
name = "tokenpulse-provider-codex"
version = "0.1.0"
edition = "2021"

[dependencies]
tokenpulse-core-domain = { path = "../core-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
sha2 = { version = "0.10", features = ["compress"] }
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

